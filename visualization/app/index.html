<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wing sensing — optimal_sensing_ELwing</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; /* no-scroll dashboard: everything fits one viewport */
    background: #0b0e14; color: #e6e6e6; font-family: system-ui, sans-serif;
  }
  #app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }

  /* --- Top bar: controls/sliders/accuracy on one line, with the status text
     (which varies a lot in length -- "E1.40_pitch · stiffness factor 1.4 ·
     axis pitch" vs shorter strings) on its OWN line below, so its length
     changing never shifts the sliders/selects above it. */
  #topbar {
    display: flex; flex-direction: column; gap: 0.3rem;
    padding: 0.4rem 0.75rem; background: #12151c; border-bottom: 1px solid #2c2c2a;
    font-size: 0.8rem; color: #c3c2b7;
  }
  #topbar-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
  #status { color: #9aa4b2; white-space: nowrap; }
  #controls { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  #controls label { display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
  #param-controls { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  #accuracy-readout {
    display: flex; align-items: center; gap: 0.35rem; white-space: nowrap;
    padding: 3px 10px; border: 1px solid #3d5166; border-radius: 999px;
    background: #1a2a3d;
  }
  #accuracy-value { color: #7fd0ff; font-weight: 700; font-size: 1rem; }
  /* Plain "i" in a CSS-drawn circle, not the "ⓘ" Unicode glyph -- that
     character isn't covered by every system font and was rendering as a
     tofu/question-mark box on some systems. */
  #accuracy-notice {
    display: none; width: 13px; height: 13px; line-height: 12px; text-align: center;
    border-radius: 50%; border: 1px solid #898781; color: #898781; cursor: help;
    font: italic 9px/12px Georgia, serif; flex: none;
  }

  /* --- Main row: left panel (3D/2D toggle) + right panel (charts). Both
     min-height:0/min-width:0 so they can shrink below content size instead of
     overflowing the fixed-height grid row (the #1 way a no-scroll layout fails). */
  #main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }

  #left-panel {
    position: relative; min-width: 0; min-height: 0; overflow: hidden;
    background: #0b0e14; border-right: 1px solid #2c2c2a;
  }
  #canvas-wrap, #wing2d-wrap { position: absolute; inset: 0; }
  #wing2d-wrap {
    display: flex; align-items: center; justify-content: center;
    /* extra top padding clears #left-panel-note, which sits above this at a
       fixed position regardless of which view (2D/3D) is showing */
    padding: 2.6rem 0.5rem 0.5rem;
  }
  /* grid (not flex+gap) so each condition gets an equal-width column and is
     centered WITHIN that column, instead of the pair being centered as one
     block within the full panel (which left both canvases clustered off to
     one side rather than each centered in its own half). */
  #wing2d-canvases { display: grid; grid-template-columns: 1fr 1fr; height: 100%; width: 100%; }
  /* title row (auto height) + canvas (flex:1, fills the REST -- not height:100%,
     which would overflow the column by the title's own height) */
  #wing2d-canvases > div { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-width: 0; min-height: 0; }
  #wing2d-canvases canvas { flex: 1; min-height: 0; width: auto; max-width: 100%; image-rendering: pixelated; cursor: pointer; }

  #panel-toggle {
    position: absolute; left: 0.6rem; bottom: 0.6rem; z-index: 2;
    background: #12151c; color: #e6e6e6; border: 1px solid #3d5166; border-radius: 4px;
    padding: 4px 10px; font: 0.75rem system-ui, sans-serif; cursor: pointer;
  }
  /* Sits above both canvas-wrap and wing2d-wrap (whichever is showing) and
     doesn't intercept clicks/drags meant for the wing views underneath. */
  #left-panel-note {
    position: absolute; top: 0.5rem; left: 0.5rem; right: 0.5rem; z-index: 2;
    text-align: center; pointer-events: none;
    color: #898781; font: 0.7rem system-ui, sans-serif;
  }

  #right-panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  #timelines-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.5rem 1rem; }
  #timelines-wrap > div { flex: 1; min-height: 0; position: relative; }

  /* --- Bottom row: PSTH histogram, full width, fixed (not flex:1) so it never
     eats space the two panels above need -- its own content sets the height. */
  #histogram-wrap { padding: 0.4rem 1rem 0.6rem; background: #0b0e14; border-top: 1px solid #2c2c2a; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="topbar-controls">
      <div id="controls">
        <label>
          Color by:
          <select id="color-mode">
            <option value="strain">Strain</option>
            <option value="pfire">P(fire)</option>
          </select>
        </label>
        <label>
          Rotation axis:
          <select id="axis-select">
            <option value="yaw">yaw</option>
            <option value="pitch">pitch</option>
            <option value="roll">roll</option>
          </select>
        </label>
      </div>
      <div id="param-controls"></div>
      <div id="accuracy-readout">
        <span>Top-<span id="accuracy-n"></span> accuracy: <span id="accuracy-value"></span></span>
        <span id="accuracy-notice">i</span>
      </div>
    </div>
    <span id="status">Loading…</span>
  </div>
  <div id="main">
    <div id="left-panel">
      <div id="left-panel-note">The difference between the two wings' strain is small, but detectable by a small set of well-placed neurons.</div>
      <div id="canvas-wrap"></div>
      <div id="wing2d-wrap">
        <div id="wing2d-canvases"></div>
      </div>
      <button id="panel-toggle" type="button">⇄ 2D view</button>
    </div>
    <div id="right-panel">
      <div id="timelines-wrap"></div>
    </div>
  </div>
  <div id="histogram-wrap"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
